<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 30px Arial, sans-serif; fill: #1b1b1b; }
      .subtitle { font: 500 16px Arial, sans-serif; fill: #5c5c5c; }
      .entity { fill: #ffffff; stroke: #2f2f2f; stroke-width: 2.2; }
      .process { fill: #eef6f2; stroke: #2d6a4f; stroke-width: 2.6; }
      .store { fill: #ffffff; stroke: #7a6848; stroke-width: 2.2; }
      .label { font: 700 18px Arial, sans-serif; fill: #202020; }
      .text { font: 15px Arial, sans-serif; fill: #2d2d2d; }
      .small { font: 14px Arial, sans-serif; fill: #404040; }
      .arrow { stroke: #303030; stroke-width: 2.1; fill: none; marker-end: url(#arrowhead); }
      .guide { stroke: #d9d9d9; stroke-width: 1; fill: none; stroke-dasharray: 5 5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#303030"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="900"/>
  <text class="title" x="700" y="54" text-anchor="middle">Level 1 Data Flow Diagram - Smart Mandi 8</text>
  <text class="subtitle" x="700" y="82" text-anchor="middle">Detailed view of core user, mandi, and admin processes</text>

  <!-- External entities -->
  <rect class="entity" x="70" y="180" width="190" height="84" rx="12"/>
  <text class="label" x="165" y="230" text-anchor="middle">USER</text>

  <rect class="entity" x="70" y="620" width="190" height="84" rx="12"/>
  <text class="label" x="165" y="670" text-anchor="middle">ADMIN</text>

  <rect class="entity" x="1150" y="180" width="190" height="84" rx="12"/>
  <text class="label" x="1245" y="230" text-anchor="middle">GOVT. API</text>

  <rect class="entity" x="1150" y="330" width="190" height="84" rx="12"/>
  <text class="label" x="1245" y="380" text-anchor="middle">LOCATION SERVICE</text>

  <!-- Processes -->
  <ellipse class="process" cx="430" cy="180" rx="165" ry="62"/>
  <text class="label" x="430" y="174" text-anchor="middle">1.1 User Authentication</text>
  <text class="text" x="430" y="198" text-anchor="middle">Registration and Login</text>

  <ellipse class="process" cx="430" cy="380" rx="165" ry="62"/>
  <text class="label" x="430" y="374" text-anchor="middle">1.2 Mandi Search</text>
  <text class="text" x="430" y="398" text-anchor="middle">City / GPS Based Search</text>

  <ellipse class="process" cx="430" cy="580" rx="165" ry="62"/>
  <text class="label" x="430" y="574" text-anchor="middle">1.3 Feedback and Query</text>
  <text class="text" x="430" y="598" text-anchor="middle">Submission Handling</text>

  <ellipse class="process" cx="790" cy="270" rx="180" ry="68"/>
  <text class="label" x="790" y="264" text-anchor="middle">1.4 Mandi Price View</text>
  <text class="text" x="790" y="288" text-anchor="middle">Live and Cached Price Details</text>

  <ellipse class="process" cx="790" cy="580" rx="180" ry="68"/>
  <text class="label" x="790" y="574" text-anchor="middle">1.5 Admin Dashboard</text>
  <text class="text" x="790" y="598" text-anchor="middle">Reports and Analytics</text>

  <!-- Data stores -->
  <rect class="store" x="1045" y="510" width="235" height="72"/>
  <line x1="1066" y1="510" x2="1066" y2="582" stroke="#7a6848" stroke-width="2.2"/>
  <text class="label" x="1162" y="554" text-anchor="middle">D1 User Database</text>

  <rect class="store" x="1045" y="620" width="235" height="72"/>
  <line x1="1066" y1="620" x2="1066" y2="692" stroke="#7a6848" stroke-width="2.2"/>
  <text class="label" x="1162" y="664" text-anchor="middle">D2 Mandi Data Store</text>

  <rect class="store" x="1045" y="730" width="235" height="72"/>
  <line x1="1066" y1="730" x2="1066" y2="802" stroke="#7a6848" stroke-width="2.2"/>
  <text class="label" x="1162" y="774" text-anchor="middle">D3 Feedback / Query DB</text>

  <!-- Alignment guides -->
  <line class="guide" x1="260" y1="270" x2="1045" y2="270"/>
  <line class="guide" x1="260" y1="580" x2="1045" y2="580"/>

  <!-- User to processes -->
  <path class="arrow" d="M260 222 H265"/>
  <text class="small" x="295" y="202">registration / login data</text>

  <path class="arrow" d="M265 242 H260"/>
  <text class="small" x="298" y="262">authentication result</text>

  <path class="arrow" d="M260 230 C330 290, 330 330, 280 360"/>
  <text class="small" x="274" y="314">search request</text>

  <path class="arrow" d="M260 236 C345 395, 338 500, 278 548"/>
  <text class="small" x="270" y="470">feedback / query data</text>

  <!-- Admin to dashboard -->
  <path class="arrow" d="M260 662 C330 652, 345 630, 282 606"/>
  <text class="small" x="287" y="640">dashboard request</text>

  <path class="arrow" d="M610 580 H260"/>
  <text class="small" x="420" y="564">reports / analytics</text>

  <!-- Process to process -->
  <path class="arrow" d="M595 380 C665 380, 685 348, 640 315"/>
  <text class="small" x="650" y="356">selected mandi</text>

  <path class="arrow" d="M595 400 C675 420, 700 370, 658 330"/>
  <text class="small" x="664" y="420">location-based results</text>

  <path class="arrow" d="M595 580 H610"/>
  <text class="small" x="600" y="562">submitted records</text>

  <!-- Processes to external services -->
  <path class="arrow" d="M970 260 C1045 230, 1080 220, 1150 222"/>
  <text class="small" x="1048" y="236">live price request</text>

  <path class="arrow" d="M1150 372 C1068 372, 1030 372, 970 372"/>
  <text class="small" x="1038" y="355">coordinates / location data</text>

  <!-- Processes to data stores -->
  <path class="arrow" d="M595 180 C770 180, 910 270, 1045 545"/>
  <text class="small" x="780" y="160">store user profile</text>

  <path class="arrow" d="M970 300 C1030 405, 1040 500, 1045 650"/>
  <text class="small" x="1000" y="450">cache mandi records</text>

  <path class="arrow" d="M595 580 C770 600, 900 685, 1045 765"/>
  <text class="small" x="792" y="648">save feedback and queries</text>

  <!-- Data stores back to processes -->
  <path class="arrow" d="M1045 545 C950 490, 840 345, 595 205"/>
  <text class="small" x="885" y="430">user details</text>

  <path class="arrow" d="M1045 650 C975 640, 935 615, 970 580"/>
  <text class="small" x="960" y="675">mandi price data</text>

  <path class="arrow" d="M1045 760 C960 720, 930 650, 950 604"/>
  <text class="small" x="940" y="746">feedback / query report</text>

  <!-- Dashboard reads -->
  <path class="arrow" d="M970 560 C995 555, 1010 552, 1045 548"/>
  <text class="small" x="992" y="540">read user data</text>

  <path class="arrow" d="M970 585 C1002 605, 1018 620, 1045 644"/>
  <text class="small" x="1002" y="610">read mandi data</text>

  <path class="arrow" d="M970 608 C1005 675, 1020 710, 1045 754"/>
  <text class="small" x="1004" y="690">read feedback records</text>
</svg>
